name: Body reliability regression

on:
  push:
    branches: [main]
    paths:
      - "body_runtime_host/worldmodel/**"
      - "body_runtime_host/runtime.py"
      - "body_runtime_host/command_replay.py"
      - "tests/test_body_reliability_v1.py"
      - "tests/test_body_command_replay.py"
      - "tests/test_body_http_fault_injection.py"
      - "tests/test_body_command_delivery.py"
      - "tests/test_body_bridge_websocket.py"
      - "tests/test_body_action_evidence.py"
      - "tests/test_body_readonly_preflight.py"
      - "tests/test_body_http_loopback.py"
      - "tests/test_body_external_action_evidence.py"
      - "tools/body_readonly_preflight.py"
      - ".github/workflows/body-reliability.yml"
  pull_request:
    paths:
      - "body_runtime_host/worldmodel/**"
      - "body_runtime_host/runtime.py"
      - "tests/test_body_reliability_v1.py"
      - "tests/test_body_command_replay.py"
      - "tests/test_body_http_fault_injection.py"
      - "tests/test_body_command_delivery.py"
      - "tests/test_body_bridge_websocket.py"
      - "tests/test_body_action_evidence.py"
      - "tests/test_body_readonly_preflight.py"
      - "tests/test_body_http_loopback.py"
      - "tests/test_body_external_action_evidence.py"
      - "tools/body_readonly_preflight.py"
      - ".github/workflows/body-reliability.yml"
  workflow_dispatch:

jobs:
  body-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal simulation dependencies
        run: python -m pip install "numpy>=1.24,<2" "websockets>=12,<16"
      - name: Run complete offline reliability suite
        shell: bash
        run: |
          set -o pipefail
          failures=0
          python -m unittest discover -s tests -p "test_body_reliability_v1.py" -v 2>&1 | tee body-reliability-plan.log || failures=$((failures + 1))
          python -m unittest discover -s tests -p "test_body_command_replay.py" -v 2>&1 | tee body-reliability-replay.log || failures=$((failures + 1))
          python -m unittest discover -s tests -p "test_body_http_fault_injection.py" -v 2>&1 | tee body-reliability-http.log || failures=$((failures + 1))
          python -m unittest discover -s tests -p "test_body_command_delivery.py" -v 2>&1 | tee body-reliability-delivery.log || failures=$((failures + 1))
          python -m unittest discover -s tests -p "test_body_bridge_websocket.py" -v 2>&1 | tee body-reliability-bridge.log || failures=$((failures + 1))
          python -m unittest discover -s tests -p "test_body_action_evidence.py" -v 2>&1 | tee body-reliability-evidence.log || failures=$((failures + 1))
          python -m unittest discover -s tests -p "test_body_readonly_preflight.py" -v 2>&1 | tee body-reliability-preflight.log || failures=$((failures + 1))
          python -m unittest discover -s tests -p "test_body_http_loopback.py" -v 2>&1 | tee body-reliability-loopback.log || failures=$((failures + 1))
          python -m unittest discover -s tests -p "test_body_external_action_evidence.py" -v 2>&1 | tee body-reliability-external.log || failures=$((failures + 1))
          echo "Failed suites: $failures"
          test "$failures" -eq 0
      - name: Upload offline test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body-reliability-logs
          path: body-reliability-*.log
          if-no-files-found: warn
